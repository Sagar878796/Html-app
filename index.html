<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SDTVLIVE | Jio TV</title>
    <meta name="description" content="Sportlink - Jio TV Streaming Dashboard">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-body: #060b18;
            --bg-card: #0e1628;
            --bg-card-hover: #131e35;
            --text-main: #f1f5f9;
            --text-muted: #64748b;
            --primary: #6366f1;
            --primary-2: #06b6d4;
            --accent-1: #f43f5e;
            --accent-2: #f59e0b;
            --accent-3: #10b981;
            --border: #1a2744;
            --border-bright: #2a3f6e;
            --header-height: 64px;
            --transition: all 0.25s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-body); color: var(--text-main); min-height: 100vh; }
        a { text-decoration: none; color: inherit; }
        img { display: block; max-width: 100%; }

        /* ── HEADER ── */
        header {
            height: var(--header-height);
            background: rgba(6, 11, 24, 0.97);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #6366f1, #06b6d4);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
            box-shadow: 0 0 18px rgba(99,102,241,0.45);
        }

        .brand .accent { background: linear-gradient(90deg, #6366f1, #06b6d4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

        /* ── SEARCH ── */
        .search-wrapper {
            position: relative;
            width: min(300px, 38vw);
        }

        .search-wrapper input {
            width: 100%;
            background: var(--bg-card);
            border: 1px solid var(--border-bright);
            padding: 8px 14px 8px 36px;
            border-radius: 10px;
            color: var(--text-main);
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition);
        }

        .search-wrapper input::placeholder { color: var(--text-muted); }
        .search-wrapper input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99,102,241,0.2); }

        .search-wrapper i {
            position: absolute;
            left: 11px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        /* ── MAIN ── */
        main { padding: 18px 16px; max-width: 1600px; margin: 0 auto; }

        /* ── SECTION BAR ── */
        .section-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-bar-left { display: flex; align-items: center; gap: 10px; }
        .section-bar-left h1 { font-size: 1rem; font-weight: 700; }

        .live-badge {
            background: var(--accent-1);
            color: white;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 20px;
            letter-spacing: 0.8px;
            box-shadow: 0 0 10px rgba(244,63,94,0.5);
            animation: pulse-badge 2s infinite;
        }

        .channel-count {
            font-size: 0.72rem;
            color: var(--text-muted);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 3px 10px;
            border-radius: 20px;
        }

        @keyframes pulse-badge { 0%, 100% { opacity: 1; box-shadow: 0 0 10px rgba(244,63,94,0.5); } 50% { opacity: 0.7; box-shadow: 0 0 20px rgba(244,63,94,0.8); } }

        /* ── GRID — FIXED 2 COL ON MOBILE ── */
        #listContainer {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        @media (min-width: 480px)  { #listContainer { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 11px; } }
        @media (min-width: 640px)  { #listContainer { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; } }
        @media (min-width: 900px)  { #listContainer { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; } }
        @media (min-width: 1100px) { #listContainer { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
        @media (min-width: 1300px) { #listContainer { grid-template-columns: repeat(7, minmax(0, 1fr)); } }
        @media (min-width: 1500px) { #listContainer { grid-template-columns: repeat(9, minmax(0, 1fr)); } }

        /* ── CARD ── */
        .box1 {
            animation: fadeUp 0.35s ease backwards;
            min-width: 0;
        }

        .card-item {
            background: var(--bg-card);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
        }

        .card-item::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--card-c1, #6366f1), var(--card-c2, #06b6d4));
            opacity: 0;
            transition: opacity 0.25s;
            z-index: 0;
            pointer-events: none;
        }

        .card-item:hover::before { opacity: 0.08; }

        .card-item:hover {
            border-color: var(--border-bright);
            transform: translateY(-4px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.5), 0 0 0 1px rgba(99,102,241,0.25);
        }

        .card-img-wrapper {
            aspect-ratio: 16/9;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            background: #080f22;
            position: relative;
            z-index: 1;
        }

        .card-img-wrapper img {
            max-height: 48px;
            max-width: 88%;
            object-fit: contain;
            transition: transform 0.25s ease;
            filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6));
        }

        .card-item:hover .card-img-wrapper img { transform: scale(1.1); }

        /* colored top stripe per card (cycles) */
        .card-stripe {
            height: 3px;
            width: 100%;
        }

        .card-info {
            padding: 7px 9px 8px;
            border-top: 1px solid var(--border);
            position: relative;
            z-index: 1;
        }

        .card-info h2 {
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-info p {
            font-size: 0.62rem;
            color: var(--text-muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ── COLOR CYCLES for stripes ── */
        .stripe-0 { background: linear-gradient(90deg, #6366f1, #8b5cf6); }
        .stripe-1 { background: linear-gradient(90deg, #06b6d4, #0ea5e9); }
        .stripe-2 { background: linear-gradient(90deg, #f43f5e, #fb7185); }
        .stripe-3 { background: linear-gradient(90deg, #f59e0b, #fbbf24); }
        .stripe-4 { background: linear-gradient(90deg, #10b981, #34d399); }
        .stripe-5 { background: linear-gradient(90deg, #a855f7, #d946ef); }
        .stripe-6 { background: linear-gradient(90deg, #3b82f6, #60a5fa); }

        /* ── LOADING ── */
        .loading-spinner {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .spinner {
            width: 38px;
            height: 38px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto 14px;
        }

        .loading-spinner p { font-size: 0.82rem; }

        /* ── NO RESULTS ── */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-muted);
            font-size: 0.88rem;
            display: none;
        }

        .no-results i { font-size: 2.5rem; display: block; margin-bottom: 10px; opacity: 0.3; }

        /* ── FOOTER ── */
        footer {
            text-align: center;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.72rem;
            border-top: 1px solid var(--border);
            margin-top: 24px;
        }

        /* ── ANIMATIONS ── */
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ── MOBILE FIXES ── */
        @media (max-width: 480px) {
            header {
                flex-wrap: wrap;
                height: auto;
                padding: 12px 16px;
                gap: 10px;
            }
            .search-wrapper { width: 100%; order: 3; }
            main { padding: 14px 12px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <span>SDTV<span class="accent">LIVE</span></span>
        </div>
        <div class="search-wrapper">
            <i class="fas fa-search"></i>
            <input type="search" id="searchInput" placeholder="Search channels…" autocomplete="off">
        </div>
    </header>

    <main>
        <div class="section-bar">
            <div class="section-bar-left">
                <h1>SDTV TV — Live Channels</h1>
                <span class="live-badge">● LIVE</span>
            </div>
            <span class="channel-count" id="channelCount">Loading…</span>
        </div>

        <div id="listContainer">
            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <p>Loading channels…</p>
            </div>
            <div class="no-results" id="noResults">
                <i class="fas fa-satellite-dish"></i>
                No channels found.
            </div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sportlink &mdash; All rights reserved.</p>
    </footer>

    <script>
        const listContainer  = document.getElementById('listContainer');
        const searchInput    = document.getElementById('searchInput');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const noResults      = document.getElementById('noResults');
        const channelCount   = document.getElementById('channelCount');

        const STRIPES = 7;

        function createCard(item, index) {
            const box = document.createElement('div');
            box.classList.add('box1');
            box.dataset.name  = (item.name  || '').toLowerCase();
            box.dataset.group = (item.group || '').toLowerCase();

            const stripeClass = `stripe-${index % STRIPES}`;

            box.innerHTML = `
                <a href="${item.link || '#'}">
                    <div class="card-item">
                        <div class="card-stripe ${stripeClass}"></div>
                        <div class="card-img-wrapper">
                            <img src="${item.logo}" alt="${item.name || 'Channel'}" loading="lazy"
                                 onerror="this.src='https://placehold.co/120x60/080f22/6366f1?text=TV'">
                        </div>
                        <div class="card-info">
                            <h2 title="${item.name || 'Unknown'}">${item.name || 'Unknown'}</h2>
                            <p title="${item.group || 'General'}">${item.group || 'General'}</p>
                        </div>
                    </div>
                </a>`;
            return box;
        }

        async function fetchChannels() {
            try {
                const res = await fetch('https://pastefy.app/ZH3tseJk/raw');
                if (!res.ok) throw new Error('Network error');
                const data = await res.json();

                loadingSpinner.style.display = 'none';

                if (Array.isArray(data) && data.length) {
                    channelCount.textContent = `${data.length} channels`;
                    const frag = document.createDocumentFragment();
                    data.forEach((item, i) => {
                        const card = createCard(item, i);
                        card.style.animationDelay = `${Math.min(i * 0.025, 1.2)}s`;
                        frag.appendChild(card);
                    });
                    listContainer.appendChild(frag);
                } else {
                    channelCount.textContent = '0 channels';
                }
            } catch (err) {
                loadingSpinner.innerHTML = `<p style="color:#f43f5e"><i class="fas fa-exclamation-circle" style="margin-right:6px"></i>Failed to load channels. Please try again later.</p>`;
                channelCount.textContent = '';
            }
        }

        fetchChannels();

        searchInput.addEventListener('input', () => {
            const term  = searchInput.value.toLowerCase().trim();
            const cards = listContainer.querySelectorAll('.box1');
            let visible = 0;

            cards.forEach(c => {
                const match = !term || c.dataset.name.includes(term) || c.dataset.group.includes(term);
                c.style.display = match ? '' : 'none';
                if (match) visible++;
            });

            noResults.style.display = (term && visible === 0) ? 'block' : 'none';
            channelCount.textContent = term ? `${visible} result${visible !== 1 ? 's' : ''}` : `${cards.length} channels`;
        });
    </script>
</body>
</html>
