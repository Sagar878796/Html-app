<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SDTV LIVE</title>

<style>
html,body{
margin:0;padding:0;height:100vh;
font-family:sans-serif;
display:flex;flex-direction:column;
overflow:hidden;
}

/* HEADER */
header{
background:#000;
padding:10px 15px;
display:flex;justify-content:space-between;align-items:center;
color:white;
}

.logo span:first-child{color:white;font-weight:900;}
.logo span:last-child{color:red;font-weight:900;}

.icons{display:flex;gap:10px;}

.icon{
width:35px;height:35px;border-radius:50%;
display:flex;align-items:center;justify-content:center;
color:white;cursor:pointer;
}
.search{background:red;}
.whatsapp{background:#00ff08;border-radius:8px;}
.share{background:#333;}

/* SEARCH */
#search{
display:none;
width:95%;margin:5px auto;
padding:10px;border-radius:10px;
border:2px solid red;
}

/* BANNER */
#banner{
background:#0026e6;
padding:15px;
min-height:100px;
}

.big{
background:white;
border-radius:12px;
padding:10px;
display:flex;gap:10px;
align-items:center;
cursor:pointer;
min-height:100px;
}
.big img{width:100px;height:100px;}

/* FILTER */
.filters{
display:flex;
gap:8px;
padding:10px;
overflow-x:auto;
white-space:nowrap;
background:#fff;
}
.filters::-webkit-scrollbar{display:none;}

.btn{
background:red;
color:white;
padding:6px 15px;
border-radius:20px;
cursor:pointer;
flex-shrink:0;
font-weight:bold;
}
.active{background:black;}

/* GRID */
#grid{
flex:1;
overflow-y:auto;
background:#0026e6;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
}

.item{
background:#eee;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
}
.item img{
width:60px;height:60px;
object-fit:contain;
}
.item div{
font-size:12px;font-weight:bold;
margin-top:5px;
}

.loader{
width:40px;height:40px;
border:4px solid #fff;
border-top:4px solid red;
border-radius:50%;
animation:spin 1s linear infinite;
margin:50px auto;
}
@keyframes spin{100%{transform:rotate(360deg);}}

.tag{
color:red;
font-weight:900;
font-size:19px;
letter-spacing:1px;
}

.title{
font-size:18px;
font-weight:bold;
color:#000;
margin-top:3px;
}

.sub{
font-size:12px;
color:#555;
}
</style>
</head>

<body>

<header>
<div class="logo"><span>SDTV</span><span>LIVE</span></div>

<div class="icons">
<div class="icon search" onclick="toggleSearch()">🔍</div>
<div class="icon whatsapp" onclick="openWhatsApp()">🔗</div>
<div class="icon share" onclick="shareApp()">📩</div>
</div>
</header>

<input id="search" placeholder="Search..." oninput="searchChannels()">

<div id="banner"></div>

<div class="filters" id="filters"></div>

<div id="grid"><div class="loader"></div></div>

<script>

const API="https://allinonereborn.online/jtv-fetch/jstr4web.json";

let all=[];

// LOAD JSON
fetch(API)
.then(r=>r.json())
.then(data=>{
    all = data.map(c => ({
        name: c.name || "Channel",
        logo: c.logo || "",
        group: c.category || "General",
        url: c.url || "",
        key: c.key || "",
        ua: c.userAgent || "",
        ref: c.referer || "",
        origin: c.origin || ""
    }));

    createFilters();
    render(all);
});

// BUILD FINAL LINK
function build(c){
    let p=[];
    if(c.ua) p.push("User-agent="+c.ua);
    if(c.ref) p.push("Referer="+c.ref);
    if(c.origin) p.push("origin="+c.origin);

    if(c.key){
        p.push("drmScheme=clearkey");
        p.push("drmLicense="+c.key);
    }

    return p.length ? c.url+"?|"+p.join("&") : c.url;
}

// RENDER
function render(list){
let grid=document.getElementById("grid");
let banner=document.getElementById("banner");

grid.innerHTML="";

if(list.length===0){
grid.innerHTML="<div style='color:white;text-align:center;'>No Channels</div>";
return;
}

let f=list[0];

banner.innerHTML = `
<div class="big" onclick='play(${JSON.stringify(f)})'>
  <img src="${f.logo}">
  <div>
    <div class="tag">FEATURED NOW</div>
    <div class="title">${f.name}</div>
    <div class="sub">Click to play</div>
  </div>
</div>
`;

let frag=document.createDocumentFragment();

list.forEach(c=>{
let d=document.createElement("div");
d.className="item";
d.innerHTML=`<img src="${c.logo}"><div>${c.name}</div>`;
d.onclick=()=>play(c);
frag.appendChild(d);
});

grid.appendChild(frag);
}

// PLAY
function play(c){
let link = build(c);

if(window.Android){
Android.playChannel(link);
}else{
alert(link);
}
}

// FILTER BUTTONS
function createFilters(){
let f=document.getElementById("filters");
let groups=[...new Set(all.map(x=>x.group))];

f.innerHTML=`<div class="btn active" onclick="filter('all',this)">All</div>`;

groups.forEach(g=>{
let d=document.createElement("div");
d.className="btn";
d.innerText=g;
d.onclick=()=>filter(g,d);
f.appendChild(d);
});
}

// FILTER
function filter(g,el){
document.querySelectorAll('.btn').forEach(b=>b.classList.remove('active'));
el.classList.add('active');

if(g==="all") return render(all);

render(all.filter(c=>c.group.toLowerCase().includes(g.toLowerCase())));
}

// SEARCH
function searchChannels(){
let t=document.getElementById("search").value.toLowerCase();
render(all.filter(c=>c.name.toLowerCase().includes(t)));
}

// SEARCH TOGGLE
function toggleSearch(){
let s=document.getElementById("search");
s.style.display=s.style.display==="block"?"none":"block";
}

// WHATSAPP
function openWhatsApp(){
window.open("https://t.me/ipllivesdtv","_blank");
}

// SHARE
function shareApp(){
if(navigator.share){
navigator.share({title:"SDTV LIVE",url:location.href});
}else{
alert(location.href);
}
}

</script>

</body>
</html>
