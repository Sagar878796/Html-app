<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0"
>

<title>SDTV LIVE</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    height:100%;
    font-family:Arial,sans-serif;
    overflow:hidden;
    background:#0026e6;
}

/* HEADER */

header{
    height:56px;
    background:#000;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 14px;
}

.logo{
    font-size:22px;
    font-weight:900;
}

.logo .sdtv{
    color:#fff;
}

.logo .live{
    color:red;
}

.icons{
    display:flex;
    gap:8px;
}

.icon{
    width:35px;
    height:35px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:#fff;
    font-size:17px;

    cursor:pointer;

    user-select:none;
}

.searchIcon{
    background:red;
}

.telegramIcon{
    background:#229ED9;
}

.shareIcon{
    background:#333;
}


/* SEARCH */

#searchBox{
    display:none;

    width:calc(100% - 20px);

    margin:7px auto;

    padding:10px 13px;

    border:2px solid red;
    border-radius:10px;

    outline:none;

    font-size:15px;
}


/* FEATURED */

#banner{
    background:#0026e6;

    padding:12px;

    min-height:120px;
}

.featured{
    width:100%;

    min-height:105px;

    background:#fff;

    border-radius:13px;

    display:flex;

    align-items:center;

    gap:12px;

    padding:10px;

    cursor:pointer;
}

.featured img{
    width:90px;
    height:90px;

    object-fit:contain;

    border-radius:10px;
}

.featuredTag{
    color:red;

    font-weight:900;

    font-size:17px;
}

.featuredName{
    color:#000;

    font-weight:900;

    font-size:18px;

    margin-top:4px;
}

.featuredSub{
    color:#666;

    font-size:12px;

    margin-top:5px;
}


/* CATEGORY */

#filters{
    height:51px;

    display:flex;

    align-items:center;

    gap:8px;

    overflow-x:auto;

    padding:8px 10px;

    background:#fff;
}

#filters::-webkit-scrollbar{
    display:none;
}

.filterBtn{
    flex-shrink:0;

    padding:7px 15px;

    border-radius:20px;

    background:red;

    color:#fff;

    font-size:13px;

    font-weight:bold;

    cursor:pointer;
}

.filterBtn.active{
    background:#000;
}


/* CHANNEL GRID */

#grid{
    height:calc(100vh - 56px - 51px - 129px);

    overflow-y:auto;

    padding:10px;

    background:#0026e6;

    display:grid;

    grid-template-columns:
        repeat(3,minmax(0,1fr));

    gap:10px;

    align-content:start;
}

.channel{
    min-height:108px;

    padding:9px;

    background:#eee;

    border-radius:12px;

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    text-align:center;

    cursor:pointer;

    user-select:none;

    transition:
        transform .12s,
        background .12s;
}

.channel:active{
    transform:scale(.94);

    background:#ddd;
}

.channel img{
    width:60px;
    height:60px;

    object-fit:contain;

    border-radius:8px;
}

.channelName{
    color:#111;

    font-size:11px;

    font-weight:bold;

    margin-top:6px;

    line-height:14px;
}


/* LOADER */

.loader{
    width:38px;
    height:38px;

    border:4px solid #fff;

    border-top-color:red;

    border-radius:50%;

    animation:
        spin 1s linear infinite;

    margin:45px auto;
}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* EMPTY */

.empty{
    grid-column:1/-1;

    text-align:center;

    color:#fff;

    font-weight:bold;

    padding:45px 10px;
}


/* TOAST */

#toast{
    position:fixed;

    left:15px;
    right:15px;

    bottom:20px;

    background:#111;

    color:#fff;

    padding:13px;

    border-radius:10px;

    text-align:center;

    display:none;

    z-index:9999;
}

</style>

</head>


<body>


<!-- HEADER -->

<header>

    <div class="logo">

        <span class="sdtv">SDTV</span>
        <span class="live">LIVE</span>

    </div>


    <div class="icons">

        <div
            class="icon searchIcon"
            onclick="toggleSearch()"
        >
            🔍
        </div>


        <div
            class="icon telegramIcon"
            onclick="openTelegram()"
        >
            🔗
        </div>


        <div
            class="icon shareIcon"
            onclick="shareApp()"
        >
            📤
        </div>

    </div>

</header>


<!-- SEARCH -->

<input
    id="searchBox"
    type="text"
    placeholder="Search channel..."
    oninput="searchChannels()"
/>


<!-- FEATURED -->

<div id="banner">

    <div class="loader"></div>

</div>


<!-- FILTERS -->

<div id="filters"></div>


<!-- CHANNELS -->

<div id="grid">

    <div class="loader"></div>

</div>


<!-- TOAST -->

<div id="toast"></div>


<script>


/* =====================================================
   JSON URL
===================================================== */

const JSON_URL =
    "https://jjtvxweb.pages.dev/jstr4web.json";


/* =====================================================
   DATA
===================================================== */

let allChannels = [];

let visibleChannels = [];

let currentCategory = "All";


/* =====================================================
   START
===================================================== */

loadJSON();


/* =====================================================
   LOAD JSON
===================================================== */

async function loadJSON(){

    const grid =
        document.getElementById("grid");

    try{

        showLoader();


        const response =
            await fetch(JSON_URL,{

                cache:"no-cache"

            });


        if(!response.ok){

            throw new Error(
                "HTTP " + response.status
            );

        }


        const json =
            await response.json();


        let data = json;


        /*
         Supports:

         [
           {...}
         ]

         OR

         {
           channels:[...]
         }
        */

        if(
            !Array.isArray(data) &&
            Array.isArray(data.channels)
        ){

            data = data.channels;

        }


        if(!Array.isArray(data)){

            throw new Error(
                "JSON array not found"
            );

        }


        /* NORMALIZE */

        allChannels =
            data
            .map(normalizeChannel)
            .filter(function(channel){

                return (
                    channel.name &&
                    channel.url
                );

            });


        visibleChannels =
            allChannels.slice();


        createCategories();


        renderChannels(
            visibleChannels
        );


        console.log(
            "SDTV LIVE:",
            allChannels.length,
            "channels loaded"
        );


    }catch(error){

        console.error(
            "JSON ERROR:",
            error
        );


        grid.innerHTML = `

            <div class="empty">

                ❌ Channel list load failed

                <br><br>

                ${escapeHTML(
                    error.message
                )}

            </div>

        `;

    }

}


/* =====================================================
   NORMALIZE JSON
===================================================== */

function normalizeChannel(c){

    return {

        id:
            c.id ||
            c.channelId ||
            "",

        name:
            c.name ||
            c.channelName ||
            c.title ||
            "Unknown",

        category:
            c.category ||
            c.group ||
            c.groupTitle ||
            "General",

        logo:
            c.logo ||
            c.image ||
            c.tvgLogo ||
            "",

        url:
            c.url ||
            c.stream_url ||
            c.streamUrl ||
            ""

    };

}


/* =====================================================
   CATEGORIES
===================================================== */

function createCategories(){

    const filters =
        document.getElementById(
            "filters"
        );


    filters.innerHTML = "";


    const categories = [

        "All",

        ...new Set(

            allChannels
            .map(function(c){

                return c.category;

            })
            .filter(Boolean)

        )

    ];


    categories.forEach(function(category){

        const button =
            document.createElement("div");


        button.className =
            "filterBtn";


        if(category === "All"){

            button.classList.add(
                "active"
            );

        }


        button.textContent =
            category;


        button.onclick =
            function(){

                selectCategory(
                    category,
                    button
                );

            };


        filters.appendChild(
            button
        );

    });

}


/* =====================================================
   CATEGORY FILTER
===================================================== */

function selectCategory(
    category,
    button
){

    currentCategory =
        category;


    document
    .querySelectorAll(".filterBtn")
    .forEach(function(btn){

        btn.classList.remove(
            "active"
        );

    });


    button.classList.add(
        "active"
    );


    const search =
        document
        .getElementById(
            "searchBox"
        )
        .value
        .trim()
        .toLowerCase();


    visibleChannels =
        allChannels.filter(function(c){

            const categoryMatch =
                category === "All" ||
                c.category
                .toLowerCase()
                .includes(
                    category.toLowerCase()
                );


            const searchMatch =
                !search ||
                c.name
                .toLowerCase()
                .includes(search);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    renderChannels(
        visibleChannels
    );

}


/* =====================================================
   SEARCH
===================================================== */

function searchChannels(){

    const text =
        document
        .getElementById(
            "searchBox"
        )
        .value
        .trim()
        .toLowerCase();


    visibleChannels =
        allChannels.filter(function(c){

            const categoryMatch =
                currentCategory === "All" ||
                c.category
                .toLowerCase()
                .includes(
                    currentCategory
                    .toLowerCase()
                );


            const searchMatch =
                !text ||
                c.name
                .toLowerCase()
                .includes(text);


            return (
                categoryMatch &&
                searchMatch
            );

        });


    renderChannels(
        visibleChannels
    );

}


/* =====================================================
   RENDER
===================================================== */

function renderChannels(list){

    const grid =
        document.getElementById(
            "grid"
        );


    const banner =
        document.getElementById(
            "banner"
        );


    grid.innerHTML = "";


    if(!list.length){

        grid.innerHTML = `

            <div class="empty">

                😔 No channel found

            </div>

        `;

        banner.innerHTML = "";

        return;

    }


    /* FEATURED */

    const featured =
        list[0];


    banner.innerHTML = "";


    const featuredBox =
        document.createElement("div");


    featuredBox.className =
        "featured";


    featuredBox.onclick =
        function(){

            playChannel(
                featured
            );

        };


    if(featured.logo){

        const img =
            document.createElement("img");


        img.src =
            featured.logo;


        img.onerror =
            function(){

                this.style.display =
                    "none";

            };


        featuredBox.appendChild(
            img
        );

    }


    const info =
        document.createElement("div");


    info.innerHTML = `

        <div class="featuredTag">
            FEATURED NOW
        </div>

        <div class="featuredName">
            ${escapeHTML(
                featured.name
            )}
        </div>

        <div class="featuredSub">
            Tap to play
        </div>

    `;


    featuredBox.appendChild(
        info
    );


    banner.appendChild(
        featuredBox
    );


    /* GRID */

    const fragment =
        document.createDocumentFragment();


    list.forEach(function(channel){

        const item =
            document.createElement("div");


        item.className =
            "channel";


        if(channel.logo){

            const img =
                document.createElement("img");


            img.src =
                channel.logo;


            img.loading =
                "lazy";


            img.onerror =
                function(){

                    this.style.display =
                        "none";

                };


            item.appendChild(
                img
            );

        }


        const name =
            document.createElement("div");


        name.className =
            "channelName";


        name.textContent =
            channel.name;


        item.appendChild(
            name
        );


        item.onclick =
            function(){

                playChannel(
                    channel
                );

            };


        fragment.appendChild(
            item
        );

    });


    grid.appendChild(
        fragment
    );

}


/* =====================================================
   PLAY CHANNEL
===================================================== */

function playChannel(channel){

    if(!channel || !channel.url){

        showToast(
            "Stream URL unavailable"
        );

        return;

    }


    console.log(
        "Selected:",
        channel.name
    );


    console.log(
        "URL:",
        channel.url
    );


    /*
     ==================================================
     ANDROID APP
     ==================================================

     Android interface:

     Android.playChannel(url, name)

    */

    if(
        window.Android &&
        typeof Android.playChannel ===
        "function"
    ){

        Android.playChannel(
            channel.url,
            channel.name
        );

        return;

    }


    /*
     ==================================================
     BROWSER FALLBACK
     ==================================================

     Browser cannot directly behave like
     your Android ExoPlayer bridge.

     We simply show the URL.
    */

    showToast(
        "Open this channel in the Android app"
    );


    console.log(
        channel.url
    );

}


/* =====================================================
   SEARCH TOGGLE
===================================================== */

function toggleSearch(){

    const box =
        document.getElementById(
            "searchBox"
        );


    if(box.style.display === "block"){

        box.style.display =
            "none";

        box.value = "";

        searchChannels();

    }else{

        box.style.display =
            "block";

        box.focus();

    }

}


/* =====================================================
   TELEGRAM
===================================================== */

function openTelegram(){

    window.open(
        "https://t.me/ipllivesdtv",
        "_blank"
    );

}


/* =====================================================
   SHARE
===================================================== */

async function shareApp(){

    const data = {

        title:
            "SDTV LIVE",

        text:
            "Watch SDTV LIVE",

        url:
            location.href

    };


    if(
        navigator.share
    ){

        try{

            await navigator.share(
                data
            );

        }catch(e){

            console.log(
                "Share cancelled"
            );

        }

        return;

    }


    if(
        window.Android &&
        typeof Android.shareApp ===
        "function"
    ){

        Android.shareApp(
            location.href
        );

        return;

    }


    try{

        await navigator
            .clipboard
            .writeText(
                location.href
            );

        showToast(
            "Link copied"
        );

    }catch(e){

        showToast(
            location.href
        );

    }

}


/* =====================================================
   LOADER
===================================================== */

function showLoader(){

    document.getElementById(
        "grid"
    ).innerHTML =

        '<div class="loader"></div>';

}


/* =====================================================
   TOAST
===================================================== */

let toastTimer;


function showToast(message){

    const toast =
        document.getElementById(
            "toast"
        );


    toast.textContent =
        message;


    toast.style.display =
        "block";


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(function(){

            toast.style.display =
                "none";

        },2500);

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHTML(value){

    return String(value)

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>

</body>

</html>
