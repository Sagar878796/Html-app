<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SDTV LIVE</title>

<style>

html,body{
margin:0;
padding:0;
height:100vh;
font-family:sans-serif;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */

header{
background:#000;
padding:10px 15px;
display:flex;
justify-content:space-between;
align-items:center;
color:white;
}

.logo span:first-child{
color:white;
font-weight:900;
}

.logo span:last-child{
color:red;
font-weight:900;
}

.icons{
display:flex;
gap:10px;
}

.icon{
width:35px;
height:35px;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
color:white;
cursor:pointer;
}

.search{
background:red;
}

.whatsapp{
background:#00ff08;
border-radius:8px;
}

.share{
background:#333;
}

/* SEARCH */

#search{
display:none;
width:95%;
margin:5px auto;
padding:10px;
border-radius:10px;
border:2px solid red;
box-sizing:border-box;
outline:none;
}

/* BANNER */

#banner{
background:#0026e6;
padding:15px;
min-height:100px;
}

.big{
background:white;
border-radius:12px;
padding:10px;
display:flex;
gap:10px;
align-items:center;
cursor:pointer;
min-height:100px;
}

.big img{
width:100px;
height:100px;
object-fit:contain;
}

/* FILTER */

.filters{
display:flex;
gap:8px;
padding:10px;
overflow-x:auto;
white-space:nowrap;
background:#fff;
}

.filters::-webkit-scrollbar{
display:none;
}

.btn{
background:red;
color:white;
padding:6px 15px;
border-radius:20px;
cursor:pointer;
flex-shrink:0;
font-weight:bold;
}

.active{
background:black;
}

/* GRID */

#grid{
flex:1;
overflow-y:auto;
background:#0026e6;
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
padding:10px;
align-content:start;
}

.item{
background:#eee;
border-radius:12px;
padding:10px;
text-align:center;
cursor:pointer;
}

.item img{
width:60px;
height:60px;
object-fit:contain;
}

.item div{
font-size:12px;
font-weight:bold;
margin-top:5px;
}

/* LOADER */

.loader{
width:40px;
height:40px;
border:4px solid #fff;
border-top:4px solid red;
border-radius:50%;
animation:spin 1s linear infinite;
margin:50px auto;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

/* TEXT */

.tag{
color:red;
font-weight:900;
font-size:19px;
letter-spacing:1px;
}

.title{
font-size:18px;
font-weight:bold;
color:#000;
margin-top:3px;
}

.sub{
font-size:12px;
color:#555;
}

.error{
color:white;
text-align:center;
padding:30px 15px;
font-weight:bold;
}

.count{
color:white;
text-align:center;
font-size:12px;
padding:5px;
background:#001cb0;
}

</style>
</head>

<body>

<header>

<div class="logo">
<span>SDTV</span><span>LIVE</span>
</div>

<div class="icons">

<div class="icon search" onclick="toggleSearch()">
🔍
</div>

<div class="icon whatsapp" onclick="openTelegram()">
🔗
</div>

<div class="icon share" onclick="shareApp()">
📩
</div>

</div>

</header>


<input
id="search"
placeholder="Search channel..."
oninput="searchChannels()"
>


<div id="banner"></div>

<div class="filters" id="filters"></div>

<div id="grid">
<div class="loader"></div>
</div>


<script>

/* =========================================
   JSON SOURCE
========================================= */

const JSON_URL =
"https://jjtvxweb.pages.dev/jstr4web.json";


let all = [];


/* =========================================
   LOAD JSON
========================================= */

async function loadChannels(){

const grid =
document.getElementById("grid");

try{

grid.innerHTML =
'<div class="loader"></div>';


const response =
await fetch(JSON_URL,{
cache:"no-store"
});


if(!response.ok){

throw new Error(
"JSON HTTP Error: " +
response.status
);

}


const data =
await response.json();


/*
Support:

[
 {...},
 {...}
]

OR

{
 "channels":[...]
}

OR

{
 "data":[...]
}

OR

{
 "items":[...]
}
*/

if(Array.isArray(data)){

all = data;

}

else if(Array.isArray(data.channels)){

all = data.channels;

}

else if(Array.isArray(data.data)){

all = data.data;

}

else if(Array.isArray(data.items)){

all = data.items;

}

else{

throw new Error(
"Unsupported JSON format"
);

}


/* Clean channels */

all = all
.filter(c =>
c &&
c.name &&
c.url
)
.map(normalizeChannel);


console.log(
"Channels loaded:",
all.length
);


createFilters();

render(all);


}

catch(error){

console.error(error);

grid.innerHTML = `
<div class="error">
❌ Channel loading failed
<br><br>
${escapeHtml(error.message)}
</div>
`;

}

}


/* =========================================
   NORMALIZE CHANNEL
========================================= */

function normalizeChannel(c){

return{

id:
c.id || "",

name:
String(c.name || "Unknown"),

category:
String(
c.category ||
c.group ||
"General"
),

url:
String(c.url || ""),

logo:
String(
c.logo ||
c.image ||
""
),

/*
DRM detection only.
Actual key is NOT exposed.
*/

drm:
detectDRM(c)

};

}


/* =========================================
   DRM DETECTION
========================================= */

function detectDRM(c){

/*
Format:

keyId
key
*/

if(
c.keyId &&
c.key &&
String(c.keyId).toLowerCase() !== "null" &&
String(c.key).toLowerCase() !== "null"
){

return true;

}


/*
Format:

keys:[
 {
   keyId:"",
   key:""
 }
]
*/

if(Array.isArray(c.keys)){

for(const item of c.keys){

if(
item &&
item.keyId &&
item.key &&
String(item.keyId).toLowerCase() !== "null" &&
String(item.key).toLowerCase() !== "null"
){

return true;

}

}

}

return false;

}


/* =========================================
   FILTER CREATION
========================================= */

function createFilters(){

const container =
document.getElementById("filters");


const groups =
[
...new Set(
all.map(c => c.category)
)
]
.filter(Boolean);


container.innerHTML = `
<div
class="btn active"
onclick="filterChannels('all',this)"
>
All
</div>
`;


groups.forEach(group => {

const button =
document.createElement("div");

button.className = "btn";

button.innerText = group;

button.onclick = () =>
filterChannels(group,button);

container.appendChild(button);

});

}


/* =========================================
   FILTER
========================================= */

function filterChannels(group,element){

document
.querySelectorAll(".btn")
.forEach(btn =>
btn.classList.remove("active")
);


element.classList.add("active");


if(group === "all"){

render(all);

return;

}


const filtered =
all.filter(c =>
c.category
.toLowerCase()
.includes(
group.toLowerCase()
)
);


render(filtered);

}


/* =========================================
   RENDER
========================================= */

function render(list){

const grid =
document.getElementById("grid");

const banner =
document.getElementById("banner");


grid.innerHTML = "";


/* No channels */

if(!list.length){

banner.innerHTML = "";

grid.innerHTML = `
<div class="error">
No channels found
</div>
`;

return;

}


/* =========================================
   FEATURED
========================================= */

const featured =
list[0];


banner.innerHTML = `

<div
class="big"
onclick="playChannel(${JSON.stringify(featured.id)})"
>

<img
src="${escapeAttribute(featured.logo)}"
loading="lazy"
onerror="this.style.display='none'"
>

<div>

<div class="tag">
FEATURED NOW
</div>

<div class="title">
${escapeHtml(featured.name)}
</div>

<div class="sub">
${escapeHtml(featured.category)}
</div>

<div class="sub">
Click to play
</div>

</div>

</div>

`;


/* =========================================
   COUNT
========================================= */

const count =
document.createElement("div");

count.className = "count";

count.innerText =
`${list.length} Channels`;

grid.appendChild(count);


/* =========================================
   CHANNEL GRID
========================================= */

list.forEach(channel => {

const item =
document.createElement("div");

item.className = "item";


const img =
document.createElement("img");

img.src = channel.logo;

img.loading = "lazy";

img.onerror = function(){

this.style.display = "none";

};


const name =
document.createElement("div");

name.innerText =
channel.name;


if(channel.drm){

name.innerHTML =
escapeHtml(channel.name) +
" 🔐";

}


item.appendChild(img);

item.appendChild(name);


item.onclick = () =>
playChannel(channel.id);


grid.appendChild(item);

});

}


/* =========================================
   PLAY CHANNEL
========================================= */

function playChannel(id){

const channel =
all.find(
c => String(c.id) === String(id)
);


if(!channel){

alert("Channel not found");

return;

}


console.log(
"Selected:",
channel.name
);

console.log(
"URL:",
channel.url
);

console.log(
"DRM:",
channel.drm
);


/*
Android app bridge

Your Android app can receive
the channel URL here.

Actual DRM credentials should
be handled securely by the
authorized player/backend.
*/

if(window.Android){

try{

Android.playChannel(
channel.url
);

return;

}catch(e){

console.error(e);

}

}


/*
Browser fallback

For normal HLS/non-DRM URLs.
*/

if(
channel.url.includes(".m3u8")
){

window.open(
channel.url,
"_blank"
);

return;

}


/*
MPD / DRM stream

Browser fallback does not
attempt to expose keys.
*/

alert(
channel.name +
"\n\nThis channel requires a supported authorized player/DRM configuration."
);

}


/* =========================================
   SEARCH
========================================= */

function searchChannels(){

const text =
document
.getElementById("search")
.value
.toLowerCase()
.trim();


if(!text){

render(all);

return;

}


const result =
all.filter(c =>

c.name
.toLowerCase()
.includes(text)

||
c.category
.toLowerCase()
.includes(text)

);


render(result);

}


/* =========================================
   SEARCH TOGGLE
========================================= */

function toggleSearch(){

const search =
document.getElementById("search");


if(search.style.display === "block"){

search.style.display = "none";

}else{

search.style.display = "block";

search.focus();

}

}


/* =========================================
   TELEGRAM
========================================= */

function openTelegram(){

window.open(
"https://t.me/ipllivesdtv",
"_blank"
);

}


/* =========================================
   SHARE
========================================= */

async function shareApp(){

const shareData = {

title:"SDTV LIVE",

text:"Watch SDTV LIVE",

url:location.href

};


try{

if(
navigator.share
){

await navigator.share(
shareData
);

}

else if(window.Android){

Android.shareApp(
location.href
);

}

else{

alert(
"Share is not supported on this device."
);

}

}catch(e){

console.log(e);

}

}


/* =========================================
   SECURITY / HTML ESCAPE
========================================= */

function escapeHtml(value){

return String(value)
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


function escapeAttribute(value){

return escapeHtml(value);

}


/* =========================================
   START
========================================= */

loadChannels();

</script>

</body>
</html>
